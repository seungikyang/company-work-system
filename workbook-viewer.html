<!-- 중학생 눈높이: Java 코드와 Markdown 학습 문서를 글자로 보여 주는 읽기 화면입니다. -->
<!-- HTML은 화면의 뼈대, CSS는 색과 배치입니다. JavaScript가 연결된 화면에서는 버튼·입력에 동작을 붙입니다. -->
<!-- HTML 주석은 사람이 읽는 설명이며 화면 본문에는 나타나지 않습니다. -->
<!-- Markdown과 Java·설정 조각 학습 자료를 브라우저에서 읽을 수 있게 보여주는 공통 문서 화면 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Company Work System의 기능 워크북과 Java·설정 조각 실습 코드를 읽는 화면"
  >
  <title>워크북 읽기 · Company Work System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23185c45'/%3E%3Cpath d='M18 17h20c5 0 8 3 8 8v24H26c-5 0-8-3-8-8V17z' fill='%23fffdf7'/%3E%3Cpath d='M26 17v32' stroke='%23d4682d' stroke-width='4'/%3E%3C/svg%3E">
  <style>
    /* CSS는 HTML 요소의 모양을 정합니다. 아래 공통 스타일 뒤의 @media는 좁은 화면·인쇄 환경에 맞게 배치를 조정합니다. */
    :root {
      color-scheme: light;
      --ink: #18211b;
      --muted: #5d6961;
      --paper: #f5f2e9;
      --surface: #fffdf7;
      --line: #d7d4c9;
      --green: #185c45;
      --green-dark: #103d2f;
      --green-soft: #dfece3;
      --orange: #d4682d;
      --shadow: 0 18px 45px rgba(34, 45, 38, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(212, 104, 45, 0.10), transparent 28rem),
        var(--paper);
      font-family:
        Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      line-height: 1.65;
    }

    a {
      color: var(--green);
    }

    a:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 20;
      padding: 0.65rem 0.9rem;
      color: white;
      background: var(--green-dark);
      border-radius: 0.5rem;
      transform: translateY(-180%);
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(215, 212, 201, 0.9);
      background: rgba(245, 242, 233, 0.94);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(1180px, calc(100% - 2rem));
      min-height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      color: var(--green-dark);
      font-size: 0.95rem;
      font-weight: 800;
      text-decoration: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .button {
      display: inline-flex;
      min-height: 40px;
      padding: 0.55rem 0.85rem;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--green-dark);
      background: var(--surface);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary {
      border-color: var(--green);
      color: white;
      background: var(--green);
    }

    .page {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(210px, 270px) minmax(0, 1fr);
      gap: 1.25rem;
      padding: 1.5rem 0 4rem;
      align-items: start;
    }

    .outline-card,
    .reader {
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .outline-card {
      position: sticky;
      top: 5.5rem;
      max-height: calc(100vh - 7rem);
      padding: 1rem;
      overflow: auto;
    }

    .outline-card h2 {
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
    }

    .outline-list {
      display: grid;
      gap: 0.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .outline-list a {
      display: block;
      padding: 0.45rem 0.55rem;
      border-radius: 0.45rem;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.35;
      text-decoration: none;
    }

    .outline-list a:hover {
      color: var(--green-dark);
      background: var(--green-soft);
    }

    .outline-list .depth-3 {
      padding-left: 1.1rem;
      font-size: 0.78rem;
    }

    .reader {
      min-width: 0;
      padding: clamp(1.25rem, 4vw, 3rem);
    }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--orange);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .reader h1 {
      margin: 0;
      color: var(--green-dark);
      font-size: clamp(1.7rem, 4vw, 2.65rem);
      line-height: 1.2;
      letter-spacing: -0.035em;
    }

    .source-label {
      margin: 0.75rem 0 2rem;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    .status {
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 0.7rem;
      color: var(--muted);
      background: #fff;
    }

    .status.error {
      border-color: #c95a46;
      color: #7c2d20;
      background: #fff2ee;
    }

    .learning-tabs { display: flex; gap: 6px; padding: 5px; margin: 24px 0; background: #e9eee8; border-radius: 12px; }
    .learning-tabs button { flex: 1; min-height: 48px; border: 0; border-radius: 9px; color: var(--muted); background: transparent; font: inherit; font-size: 0.9rem; font-weight: 750; cursor: pointer; }
    .learning-tabs [aria-pressed="true"] { background: #fff; color: var(--green-dark); box-shadow: 0 2px 6px #18211b0d; }
    .quiz-panel-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; font-size: 0.85rem; }
    .quiz-panel-heading p { margin: 0; color: var(--muted); }
    .quiz-panel-heading > div { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .quiz-panel-heading button { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--green); font: inherit; font-weight: 700; cursor: pointer; }
    .document-quiz-callout { padding: 22px; margin-top: 24px; border: 1px solid #c5d9ca; border-radius: 12px; background: #edf4ef; }
    .document-quiz-callout p { margin: 0 0 14px; color: var(--green-dark); }
    .document-quiz-callout button { min-height: 44px; padding: 10px 18px; border: 0; border-radius: 9px; color: white; background: var(--green); font: inherit; font-weight: 700; cursor: pointer; }
    #document-quiz-frame { display: block; width: 100%; height: 1000px; border: 0; }
    .layout:is(.is-solving, .has-inline-quiz) { grid-template-columns: minmax(0, 1fr); max-width: 1000px; }
    .layout:is(.is-solving, .has-inline-quiz) .outline-card { display: none; }
    .layout:is(.is-solving, .has-inline-quiz) .reading-intro { display: none; }
    .layout:is(.is-solving, .has-inline-quiz) .reader { padding-top: 24px; }
    .layout:is(.is-solving, .has-inline-quiz) .reader h1 { font-size: clamp(1.5rem, 3vw, 2rem); }
    .layout:is(.is-solving, .has-inline-quiz) .source-label { margin-bottom: 1rem; }
    .has-inline-quiz #document-body { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); scroll-margin-top: 90px; }
    #document-source-heading { margin: 0 0 20px; color: var(--green-dark); font-size: 1.3rem; }
    @media print { .learning-tabs, #quiz-panel, .document-quiz-callout { display: none !important; } #document-body[hidden] { display: block !important; } }

    .document-section {
      scroll-margin-top: 5.5rem;
    }

    .document-section + .document-section {
      margin-top: 2.4rem;
      padding-top: 0.25rem;
      border-top: 1px solid var(--line);
    }

    .document-section h2,
    .document-section h3,
    .document-section h4 {
      color: var(--green-dark);
      line-height: 1.35;
      letter-spacing: -0.02em;
    }

    .document-section h2 {
      margin: 0.5rem 0 1rem;
      font-size: 1.5rem;
    }

    .document-section h3 {
      margin: 0.4rem 0 0.85rem;
      font-size: 1.18rem;
    }

    .document-section h4 {
      margin: 0.3rem 0 0.75rem;
      font-size: 1rem;
    }

    .document-source {
      margin: 0;
      padding: 1rem;
      overflow-x: auto;
      border: 1px solid #e3dfd3;
      border-radius: 0.7rem;
      color: #26332b;
      background: #fbfaf5;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.7;
      tab-size: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 760px) {
      .topbar-inner {
        min-height: 58px;
      }

      .brand {
        max-width: 9rem;
        line-height: 1.2;
      }

      .button {
        min-height: 38px;
        padding-inline: 0.7rem;
      }

      .layout {
        grid-template-columns: 1fr;
        padding-top: 1rem;
      }

      .outline-card {
        position: static;
        max-height: 15rem;
        order: 2;
      }

      .reader {
        order: 1;
        border-radius: 0.8rem;
      }

      .document-source {
        padding: 0.8rem;
        font-size: 0.8rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
    }

    @media print {
      .topbar,
      .outline-card {
        display: none;
      }

      .layout {
        display: block;
      }

      .reader {
        border: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#document-content">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./index.html">Company Work System</a>
      <div class="actions">
        <a class="button primary" href="./index.html">메인 워크북</a>
        <button id="print-document" class="button" type="button">인쇄</button>
      </div>
    </div>
  </header>

  <main class="page layout">
    <aside class="outline-card" aria-labelledby="outline-title">
      <h2 id="outline-title">문서 목차</h2>
      <nav id="document-outline" aria-label="현재 문서 목차">
        <p>문서를 불러오는 중입니다.</p>
      </nav>
    </aside>

    <article id="document-content" class="reader" tabindex="-1">
      <p class="eyebrow">취업 결과물 워크북</p>
      <h1 id="document-title">워크북을 불러오는 중입니다.</h1>
      <p id="source-label" class="source-label"></p>
      <p class="status reading-intro"><strong>읽은 내용을 직접 확인해 보세요.</strong><br><a id="open-focus-quiz" href="./quiz.html">보기 선택 · 정답 확인 · 해설이 있는 집중 퀴즈 열기 →</a></p>
      <p class="reading-intro"><a href="./workbook-viewer.html?file=practice/beginner-guide.md">초보자 기술 안내 · 왜 쓰고 어떻게 동작하나요?</a></p>
      <p id="load-status" class="status" role="status">학습 자료를 준비하고 있습니다.</p>
      <div class="learning-tabs" role="toolbar" aria-label="학습 화면 선택">
        <button id="reading-tab" type="button" aria-controls="document-body quiz-panel" aria-pressed="true">학습 문서 읽기</button>
        <button id="solving-tab" type="button" aria-controls="document-body quiz-panel" aria-pressed="false" tabindex="-1">4지선다 직접 풀기</button>
      </div>
      <section id="quiz-panel" aria-label="4지선다 웹 퀴즈" tabindex="0" hidden>
        <div class="quiz-panel-heading"><p id="quiz-panel-description">보기를 고르고, 정답과 해설을 확인하세요.</p><div><button id="show-source" type="button" hidden>관련 코드 보기 ↓</button><a id="quiz-fullscreen-link" href="./quiz.html" target="_blank" rel="noopener">큰 화면으로 풀기 ↗</a></div></div>
        <iframe id="document-quiz-frame" title="학습 문서와 연결된 4지선다 퀴즈"></iframe>
      </section>
      <div id="document-body" role="region" aria-label="연결된 학습 문서" tabindex="0"></div>
    </article>
  </main>

  <!-- HTML로 입력창과 표시 영역을 먼저 만든 뒤, 아래 JavaScript가 DOM을 찾아 동작을 연결합니다. -->
  <script src="./practice/quiz/document-quiz.js"></script>
  <script>
    // URLSearchParams는 ?file= 뒤의 쿼리 값을 읽습니다. 이 값은 사용자 입력이므로 허용 경로 검사 후 요청합니다.
    // 주소의 ?file= 뒤는 읽을 파일을 지정하는 메모입니다. 허용한 학습 파일인지 확인한 뒤 읽습니다.
    const params = new URLSearchParams(window.location.search);
    const sourceFile = params.get("file") || "";
    // 왜 허용 목록(정규식)을 둘까요? 주소의 file= 값은 누구나 바꿔 적을 수 있습니다.
    // 검사가 없으면 '../../비밀파일'처럼 학습 자료가 아닌 파일을 읽으라는 주소를 만들 수 있어, practice 폴더의 정해진 확장자만 받습니다.
    const allowedSource =/^(?:practice\/[A-Za-z0-9._/-]+\.(?:fragment|java|md)|(?:README|company_work_system_PRD_TRD)\.md)$/;
    const documentTitle = document.getElementById("document-title");
    const sourceLabel = document.getElementById("source-label");
    const loadStatus = document.getElementById("load-status");
    const documentBody = document.getElementById("document-body");
    const documentOutline = document.getElementById("document-outline");
    const printDocument = document.getElementById("print-document");
    const quizFrame = document.getElementById("document-quiz-frame");
    const readingTab = document.getElementById("reading-tab");
    const solvingTab = document.getElementById("solving-tab");
    let quizUrl = "./quiz.html?bank=chapters&limit=10";
    let hasDocumentQuestions = false;
    // '읽기'와 '풀기' 두 탭 중 하나를 고릅니다. solving이 true면 풀기 화면입니다.
    function selectLearningTab(solving) {
      readingTab.setAttribute("aria-pressed", String(!solving));
      solvingTab.setAttribute("aria-pressed", String(solving));
      // 왜 tabIndex를 바꿀까요? Tab 키로 두 탭을 하나씩 다 거치지 않고, 선택된 탭 하나에만 멈추게 하는 접근성 관례입니다.
      // 탭 사이 이동은 아래 화살표 키 처리가 맡습니다.
      readingTab.tabIndex = solving ? -1 : 0;
      solvingTab.tabIndex = solving ? 0 : -1;
      documentBody.hidden = solving;
      const showQuiz = solving || hasDocumentQuestions;
      document.getElementById("quiz-panel").hidden = !showQuiz;
      document.querySelector(".layout").classList.toggle("is-solving", solving);
      // 왜 처음부터 src를 넣지 않을까요? 퀴즈 화면은 문제 데이터가 커서, 읽기만 하는 사람에게는 불필요한 로딩입니다.
      // 퀴즈가 처음 보일 때 한 번만 불러옵니다. embed=1은 '다른 화면 안에 끼워 넣었으니 머리말·메뉴를 숨겨 달라'는 표시입니다.
      if (showQuiz && !quizFrame.hasAttribute("src")) quizFrame.src = `${quizUrl}&embed=1`;
    }
    readingTab.addEventListener("click", () => selectLearningTab(false));
    solvingTab.addEventListener("click", () => selectLearningTab(true));
    document.getElementById("show-source").addEventListener("click", () => {
      selectLearningTab(false);
      // 초점을 먼저 옮기고(스크롤 없이) 직접 맨 위로 맞춥니다. 브라우저마다 초점 이동 때 스크롤 위치가 달라지는 것을 피하려는 것입니다.
      documentBody.focus({ preventScroll: true });
      documentBody.scrollIntoView({ block: "start", behavior: "instant" });
    });
    // 화살표·Home·End로 탭을 바꿉니다. 왜? 화면 읽기 프로그램 사용자는 탭 묶음을 이런 키로 움직인다고 기대합니다(WAI-ARIA 탭 관례).
    [readingTab, solvingTab].forEach(tab => tab.addEventListener("keydown", event => {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const solving = event.key === "End" || (event.key !== "Home" && tab === readingTab);
      selectLearningTab(solving);
      (solving ? solvingTab : readingTab).focus();
    }));
    // iframe 안의 퀴즈가 '내 높이는 이만큼'이라고 알려 주면 그 높이로 틀을 맞춥니다. 이렇게 해야 틀 안에 스크롤바가 두 겹으로 생기지 않습니다.
    // 왜 세 가지를 확인할까요? message는 어느 창이든 보낼 수 있습니다. 같은 사이트(origin)·우리 iframe(source)·약속한 종류(type)인지 확인해
    // 다른 사이트가 보낸 가짜 메시지로 화면이 망가지지 않게 합니다.
    window.addEventListener("message", event => {
      if (event.origin !== location.origin || event.source !== quizFrame.contentWindow || event.data?.type !== "company-work-system:quiz-height") return;
      // 360~12000px 사이로 제한합니다. 잘못된 값이 와도 틀이 사라지거나 끝없이 길어지지 않게 하는 안전 범위이고, +12는 아래쪽 여유입니다.
      if (Number.isFinite(event.data.height)) quizFrame.style.height = `${Math.max(360, Math.min(12000, event.data.height + 12))}px`;
    });

    // 제목에서 이동용 이름표를 만듭니다. 번호를 함께 넣어 같은 제목도 서로 다른 위치로 이동할 수 있게 합니다.
    // \p{L}\p{N}은 '모든 언어의 글자와 숫자'입니다. 왜 [a-z0-9]가 아닐까요? 그렇게 하면 한글 제목이 전부 지워져 이름표가 비어 버립니다.
    // 48글자로 자르는 이유는 주소 끝(#...)이 지나치게 길어지지 않게 하려는 것입니다.
    function makeHeadingId(title, index) {
      const slug = title
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 48);
      return `section-${index}-${slug || "item"}`;
    }

    // 줄바꿈을 통일하고 # 제목을 기준으로 구획을 나눕니다. 제목이 없는 Java 파일도 본문 구획으로 남깁니다.
    // 긴 문서를 제목마다 나누는 작업입니다. Java 코드처럼 제목이 없는 자료도 글 전체를 남깁니다.
    function splitDocument(source) {
      const chunks = [];
      let current = { level: 1, title: "", lines: [] };
      let fence = null;

      // 왜 줄바꿈을 통일할까요? Windows에서 만든 파일은 줄 끝이 \r\n이라, 그대로 나누면 줄마다 보이지 않는 \r이 남아 제목 검사가 빗나갑니다.
      source.replace(/\r\n?/g, "\n").split("\n").forEach((line) => {
        // 코드 블록 안의 # 주석과 Markdown 예시는 제목으로 나누지 않습니다.
        // 왜? yml·셸 코드의 '# 설정' 같은 줄까지 제목으로 보면 코드 블록이 중간에 잘려 목차가 엉망이 됩니다.
        // fence는 지금 ``` 코드 블록 안에 있는지 기억하는 표시입니다. 여는 기호와 같은 종류·같거나 긴 길이로 닫혀야 끝난 것으로 봅니다(Markdown 규칙).
        if (fence) {
          current.lines.push(line);
          const closing = line.match(/^ {0,3}(`+|~+)[ \t]*$/);
          if (closing && closing[1][0] === fence.marker && closing[1].length >= fence.length) fence = null;
          return;
        }
        const opening = line.match(/^ {0,3}(`{3,}|~{3,})(.*)$/);
        if (opening && (opening[1][0] !== "`" || !opening[2].includes("`"))) {
          fence = { marker: opening[1][0], length: opening[1].length };
          current.lines.push(line);
          return;
        }
        const heading = line.match(/^(#{1,6})\s+(.+?)\s*$/);
        if (!heading) {
          current.lines.push(line);
          return;
        }
        // 왜 확인할까요? 문서가 제목으로 바로 시작하면 그 앞의 '빈 구획'이 생기는데, 그런 빈 칸은 화면에 넣지 않습니다.
        if (current.title || current.lines.some((item) => item.trim())) {
          chunks.push(current);
        }
        current = {
          level: heading[1].length,
          title: heading[2],
          lines: [],
        };
      });

      if (current.title || current.lines.some((item) => item.trim())) {
        chunks.push(current);
      }
      return chunks;
    }

    // 나눈 글로 제목·목차·본문을 만듭니다. 코드는 실행하지 않고 들여쓰기를 살려 글자로 보여 줍니다.
    function renderDocument(source) {
      // 파일 끝의 자동 생성 문제는 정답이 노출되는 주석 대신 실제 선택형 풀이로 연결합니다.
      // 원본 파일은 그대로 두고, 문서에 실린 문항 ID로 같은 문제만 골라 줍니다.
      const extracted = DocumentQuiz.extract(source);
      const questionIds = extracted.ids;
      hasDocumentQuestions = questionIds.length > 0;
      document.querySelector(".layout").classList.toggle("has-inline-quiz", hasDocumentQuestions);
      if (questionIds.length) {
        readingTab.textContent = "문제 + 학습 문서";
        solvingTab.textContent = "문제만 집중해서 풀기";
        document.getElementById("quiz-panel-description").textContent = "보기 선택 → 채점 → 해설 확인";
        document.getElementById("show-source").hidden = false;
        source = extracted.source;
        const scoped = new URL(quizUrl, location.href);
        scoped.searchParams.set("items", questionIds.join(","));
        quizUrl = `./quiz.html?${scoped.searchParams}`;
        document.getElementById("open-focus-quiz").href = quizUrl;
        document.getElementById("quiz-fullscreen-link").href = quizUrl;
        // 파일 요청이 끝나기 전에 풀이 탭을 열었어도 문서에 맞는 범위로 맞춥니다.
        if (quizFrame.hasAttribute("src")) quizFrame.src = `${quizUrl}&embed=1`;
      }
      const chunks = splitDocument(source);
      const firstTitle = chunks.find((chunk) => chunk.level === 1 && chunk.title);
      const displayTitle = firstTitle?.title || sourceFile.split("/").pop() || "학습 자료";
      const outlineList = document.createElement("ol");
      outlineList.className = "outline-list";

      documentTitle.textContent = displayTitle;
      document.title = `${displayTitle} · Company Work System`;
      documentBody.replaceChildren();
      if (hasDocumentQuestions) {
        const sourceHeading = document.createElement("h2");
        sourceHeading.id = "document-source-heading";
        sourceHeading.textContent = "관련 코드로 이해하기";
        documentBody.append(sourceHeading);
      }

      chunks.forEach((chunk, index) => {
        const section = document.createElement("section");
        section.className = "document-section";
        const isPageTitle = chunk === firstTitle;

        if (chunk.title && !isPageTitle) {
          // 왜 h2~h4로 맞출까요? h1은 페이지 맨 위 제목 하나만 써야 문서 구조가 분명하고, h5·h6은 글씨가 너무 작아집니다.
          const headingLevel = Math.min(Math.max(chunk.level, 2), 4);
          const heading = document.createElement(`h${headingLevel}`);
          const headingId = makeHeadingId(chunk.title, index);
          heading.textContent = chunk.title;
          section.id = headingId;
          section.append(heading);

          // 목차에는 ###까지만 넣습니다. 더 작은 제목까지 넣으면 목차가 본문만큼 길어져 길잡이 역할을 못 합니다.
          if (chunk.level <= 3) {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = `#${headingId}`;
            link.textContent = chunk.title;
            if (chunk.level === 3) {
              link.className = "depth-3";
            }
            item.append(link);
            outlineList.append(item);
          }
        }

        const content = chunk.lines.join("\n").trim();
        if (content) {
          const sourceBlock = document.createElement("pre");
          sourceBlock.className = "document-source";
          // textContent로 넣으면 문서 속 HTML·스크립트를 실행하지 않고 문자로 표시합니다. pre는 코드의 들여쓰기를 보존합니다.
          sourceBlock.textContent = content;
          section.append(sourceBlock);
        }
        documentBody.append(section);
      });

      if (questionIds.length) {
        const callout = document.createElement("div");
        callout.className = "document-quiz-callout";
        const copy = document.createElement("p");
        copy.textContent = `코드를 확인했다면, 위의 ${questionIds.length}문제로 이해한 내용을 확인해 보세요.`;
        const solve = document.createElement("button");
        solve.type = "button";
        solve.textContent = "문제로 돌아가서 풀기 ↑";
        solve.addEventListener("click", () => { selectLearningTab(true); solvingTab.focus(); });
        callout.append(copy, solve);
        documentBody.append(callout);
      }

      if (outlineList.childElementCount) {
        documentOutline.replaceChildren(outlineList);
      } else {
        const emptyOutline = document.createElement("p");
        emptyOutline.textContent = "이 문서에는 별도 목차가 없습니다.";
        documentOutline.replaceChildren(emptyOutline);
      }
      loadStatus.hidden = true;
      // 문제 주석이 있는 파일은 첫 화면부터 실제 보기가 보이도록 합니다.
      selectLearningTab(solvingTab.getAttribute("aria-pressed") === "true");
    }

    // 경로 확인 → raw=1 원문 요청 → HTTP 성공 확인 → 제목·목차·본문 표시 순서입니다.
    // 서버도 공개 경로를 검사합니다. 브라우저 검사만으로 서버 파일의 접근 권한을 정할 수는 없습니다.
    // 파일 경로 확인 → 서버에 원문 요청 → 성공 여부 확인 → 화면 표시 순서로 진행합니다.
    async function loadDocument() {
      if (sourceFile === "practice/problems.md") {
        window.location.replace("./problems.html");
        return;
      }
      // 왜 ".."을 한 번 더 막을까요? 정규식이 '/'와 '.'을 허용하므로 practice/../../ 같은 경로가 통과할 수 있습니다. '위 폴더로 가기'를 따로 차단합니다.
      if (!allowedSource.test(sourceFile) || sourceFile.includes("..")) {
        throw new Error("허용되지 않은 학습 자료 경로입니다.");
      }

      sourceLabel.textContent = sourceFile;
      // 폴더 이름 앞 두 자리(예: 08-employee-register의 08)가 챕터 번호입니다. 이 번호로 같은 챕터의 퀴즈를 바로 연결합니다.
      // 40 미만만 받는 이유: 퀴즈 문제는 00~39장까지만 있어서, 없는 장 번호로 빈 퀴즈 화면을 열지 않으려는 것입니다.
      const chapterMatch = /^practice\/(?:starter|hard)\/(\d{2})-/.exec(sourceFile);
      if (chapterMatch && Number(chapterMatch[1]) < 40) {
        const quizLink = document.getElementById("open-focus-quiz");
        quizLink.href = `./quiz.html?bank=chapters&chapter=${chapterMatch[1]}`;
        quizLink.textContent = `${chapterMatch[1]}장 집중 퀴즈 · 보기 선택하고 해설 보기 →`;
        quizUrl = `./quiz.html?bank=chapters&chapter=${chapterMatch[1]}`;
        quizFrame.title = `${chapterMatch[1]}장 4지선다 퀴즈 · 보기 선택과 해설`;
      }
      if (sourceFile === "practice/beginner-guide.md") quizUrl = "./quiz.html?bank=fundamentals&limit=10";
      document.getElementById("open-focus-quiz").href = quizUrl;
      document.getElementById("quiz-fullscreen-link").href = quizUrl;
      const sourceUrl = new URL(`./${sourceFile}`, window.location.href);
      // raw=1은 읽기 화면 대신 파일 원문을 보내 달라는 약속입니다. 자기 화면을 계속 불러오는 일을 막습니다.
      sourceUrl.searchParams.set("raw", "1");
      const response = await fetch(sourceUrl);
      // 왜 ok를 확인할까요? fetch는 404(파일 없음)여도 오류를 던지지 않고 '없습니다' 안내 페이지를 성공처럼 돌려줍니다.
      // 확인하지 않으면 그 안내 페이지를 학습 문서인 것처럼 화면에 그리게 됩니다.
      if (!response.ok) {
        throw new Error(`학습 자료를 불러오지 못했습니다. HTTP ${response.status}`);
      }
      renderDocument(await response.text());
    }

    printDocument.addEventListener("click", () => window.print());
    // 파일을 읽다가 문제가 생기면 빈 화면 대신 파일 이름과 오류 이유를 알려 줍니다.
    loadDocument().catch((error) => {
      documentTitle.textContent = "워크북을 열 수 없습니다.";
      sourceLabel.textContent = sourceFile || "파일 경로 없음";
      loadStatus.textContent = error.message;
      loadStatus.classList.add("error");
      const retryHelp = document.createElement("p");
      retryHelp.textContent = "메인 워크북으로 돌아가 다시 시도하세요.";
      documentOutline.replaceChildren(retryHelp);
    });
  </script>
</body>
</html>
